<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc">
  <title id="title">各任務三輪累積 API 等價成本</title>
  <desc id="desc">三個任務的現行策略與反事實策略累積美元成本折線圖，使用實線與虛線區分策略</desc>
  <style>svg{color-scheme:light dark;color:CanvasText;background:transparent;font-family:system-ui,sans-serif}.axis,.grid{stroke:currentColor;stroke-opacity:.32;fill:none}.grid{stroke-opacity:.12}.series{stroke:currentColor;stroke-width:2;fill:none}.counter{stroke-dasharray:7 5}.point{fill:Canvas;stroke:currentColor;stroke-width:2}.label,.tick,.facet-title{fill:currentColor}.tick{font-size:11px}.label{font-size:12px}.facet-title{font-size:14px;font-weight:500}</style>
  <line x1="64" y1="32" x2="94" y2="32" class="series"/><text x="100" y="36" class="label">現行策略</text>
  <line x1="190" y1="32" x2="220" y2="32" class="series counter"/><text x="226" y="36" class="label">反事實策略</text>
  <text x="64" y="54" class="facet-title">login-flow-analysis</text>
  <line x1="64" y1="332" x2="304" y2="332" class="grid"/>
  <text x="56" y="336" text-anchor="end" class="tick">$0.000</text>
  <line x1="64" y1="202" x2="304" y2="202" class="grid"/>
  <text x="56" y="206" text-anchor="end" class="tick">$0.379</text>
  <line x1="64" y1="72" x2="304" y2="72" class="grid"/>
  <text x="56" y="76" text-anchor="end" class="tick">$0.757</text>
  <line x1="64" y1="72" x2="64" y2="332" class="axis"/>
  <line x1="64" y1="332" x2="304" y2="332" class="axis"/>
  <text x="64" y="354" text-anchor="middle" class="tick">R1</text>
  <text x="184" y="354" text-anchor="middle" class="tick">R2</text>
  <text x="304" y="354" text-anchor="middle" class="tick">R3</text>
  <polyline points="64,218.07 184,148.02 304,72" class="series"/>
  <circle cx="64" cy="218.07" r="3.5" class="point"/>
  <circle cx="184" cy="148.02" r="3.5" class="point"/>
  <circle cx="304" cy="72" r="3.5" class="point"/>
